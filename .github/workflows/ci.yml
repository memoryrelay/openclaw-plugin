name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the compiled entry point loads
        # OpenClaw aborts its startup migration when the plugin has no runnable
        # JS entry point (issue #138). Import the built output the way OpenClaw
        # does so a broken or missing dist/ fails here, not in someone's gateway.
        run: |
          MAIN=$(node -p "require('./package.json').main")
          test -s "$MAIN" || { echo "::error::$MAIN was not built"; exit 1; }
          node --input-type=module -e "
            const m = await import('./$MAIN');
            if (typeof m.default !== 'function') throw new Error('no plugin export');
            console.log('✓ $MAIN loads');
          "
