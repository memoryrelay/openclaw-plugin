name: Manual Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.12.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled entry point exists
        # Publishing TypeScript source without dist/ breaks OpenClaw startup
        # migrations for every installed gateway (issue #138).
        run: |
          MAIN=$(node -p "require('./package.json').main")
          test -s "$MAIN" || { echo "::error::$MAIN was not built"; exit 1; }
          echo "✓ $MAIN built"

      - name: Verify version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "Error: Input version (${{ inputs.version }}) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
      
      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
