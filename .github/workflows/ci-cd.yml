name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write  # Required for creating releases
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Validate plugin manifest
      run: |
        if [ ! -f "openclaw.plugin.json" ]; then
          echo "Error: openclaw.plugin.json not found"
          exit 1
        fi
        echo "✓ Plugin manifest exists"
    
    - name: Validate package.json
      run: |
        node -e "require('./package.json')" && echo "✓ package.json is valid JSON"
    
    - name: Check required files
      run: |
        for file in index.ts openclaw.plugin.json package.json LICENSE README.md; do
          if [ ! -f "$file" ]; then
            echo "Error: Required file $file not found"
            exit 1
          fi
        done
        echo "✓ All required files present"

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Verify the tarball ships the compiled entry point
      # v0.23.0/v0.24.0 published TypeScript source only, and every OpenClaw
      # >= 2026.7.1 that installed them refused to boot (issue #138).
      run: |
        MAIN=$(node -p "require('./package.json').main.replace(/^\.\//, '')")
        npm pack --dry-run --ignore-scripts --json > pack.json
        node -e "
          const main = process.argv[1];
          const files = require('./pack.json')[0].files.map((f) => f.path);
          if (!files.includes(main)) {
            console.error('::error::' + main + ' is missing from the npm tarball');
            process.exit(1);
          }
          console.log('✓ tarball ships ' + main);
        " "$MAIN"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      # prepublishOnly builds dist/ and needs the devDependencies present.
      run: npm ci

    - name: Build
      run: npm run build

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Verify version matches package.json
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
          echo "Error: Tag version (${{ steps.version.outputs.VERSION }}) doesn't match package.json ($PKG_VERSION)"
          exit 1
        fi
    
    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.version.outputs.VERSION }}
        body: |
          ## OpenClaw Plugin for MemoryRelay
          
          ### Installation
          ```bash
          openclaw plugins install @memoryrelay/openclaw-plugin@${{ steps.version.outputs.VERSION }}
          ```
          
          ### What's New
          See [CHANGELOG.md](CHANGELOG.md) for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
